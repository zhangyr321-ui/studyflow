<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f0e7">
  <title>StudyFlow</title>
  <link rel="stylesheet" href="styles.css?v=20261101-1">
</head>
<body>
  <div class="phone-app">
    <header class="app-header">
      <div class="brand"><span class="brand-logo">S</span><div><b>StudyFlow</b><small id="headerDate"></small></div></div>
      <button class="icon-btn" data-action="settings" aria-label="设置">⋯</button>
    </header>
    <main>
      <section class="page active" data-page="home">
        <div class="welcome"><p id="greeting"></p><h1>今天，稳稳向前</h1></div>
        <section id="onboardingCard" class="card onboarding hidden"></section>
        <section class="section-block countdown-section"><div class="section-title"><h2>重要日子</h2><button class="text-btn" data-action="add-countdown">＋ 新增</button></div><div class="countdown-strip" id="countdownList"></div></section>
        <section class="card"><div class="section-title"><h2>今日任务</h2><div><button class="text-btn" data-action="add-task">＋ 新建</button><button class="text-btn" data-nav="tasks">查看全部</button></div></div><div id="homeTaskList" class="task-list"></div></section>
        <section class="card"><div class="section-title"><h2>今日学习记录</h2><button class="text-btn" data-action="add-record">＋ 手动添加</button></div><div id="homeRecordList" class="home-record-list"></div><div id="homeRecordFoot" class="record-summary hidden"></div></section>
        <section class="card"><div class="section-title"><h2>今日数据</h2><span class="soft-chip" id="todayCompletionChip">0/0 完成</span></div><div class="metric-grid" id="todayMetrics"></div></section>
        <section class="card"><div class="section-title"><h2>今日科目构成</h2><button class="text-btn" data-action="show-today-stats">查看日统计</button></div><div id="todaySubjectBars" class="bar-list"></div></section>
        <section class="card"><div class="section-title"><h2>整体任务进度</h2><strong id="overallPct">0%</strong></div><div class="progress"><i id="overallBar"></i></div><p class="muted" id="overallText">暂无任务</p></section>
        <section id="overdueCard" class="card overdue-card hidden"></section>
      </section>
      <section class="page" data-page="tasks">
        <div class="page-title"><div><span>PROGRESS</span><h1>进度管理</h1></div><button class="primary small" id="taskPageAdd">＋ 任务</button></div>
        <div class="tabs three-tabs" id="taskMainTabs"><button class="active" data-task-main="tasks">任务</button><button data-task-main="projects">项目</button><button data-task-main="subjects">科目</button></div>
        <div id="taskPane"><div class="filter-row" id="subjectFilters"></div><div class="sub-tabs" id="taskStateTabs"><button class="active" data-task-state="today">今天</button><button data-task-state="overdue">历史未完成</button><button data-task-state="completed">已完成</button></div><div id="taskList" class="task-list roomy"></div></div>
        <div id="projectPane" class="hidden"><div class="sub-tabs" id="projectStateTabs"><button class="active" data-project-state="active">进行中</button><button data-project-state="ended">已结束</button></div><div id="projectList" class="project-list"></div></div>
        <div id="subjectPane" class="hidden"><div id="subjectList" class="subject-list"></div></div>
      </section>
      <section class="page" data-page="reviews">
        <div class="page-title"><div><span>REVIEW</span><h1>复盘</h1></div><button class="primary small" id="reviewPageAdd">＋ 复盘</button></div>
        <div class="tabs three-tabs" id="reviewMainTabs"><button class="active" data-review-main="reviews">复盘记录</button><button data-review-main="notes">学习笔记</button><button data-review-main="mocks">模考</button></div>
        <div id="reviewPane">
          <div class="sub-tabs roomy review-sub-tabs" id="reviewTabs"><button class="active" data-review-view="recent">最近</button><button data-review-view="archive">档案柜</button><button data-review-view="tags">错误标签</button></div>
          <div id="reviewRecent"><input id="reviewSearch" class="search-input" placeholder="搜索标题、内容或标签"><div class="review-filters"><select id="reviewSubjectFilter"><option value="">全部科目</option></select><select id="reviewTagFilter"><option value="">全部标签</option></select></div><div id="reviewList" class="review-list"></div><button id="reviewMore" class="secondary full hidden">加载更多</button></div>
          <div id="reviewArchive" class="hidden"><div class="sub-tabs"><button class="active" data-archive-mode="subject">按科目</button><button data-archive-mode="time">按时间</button></div><div id="archiveList" class="folder-list"></div></div>
          <div id="reviewTags" class="hidden"><section class="card compact"><div class="section-title"><h2>错误原因统计</h2></div><div id="tagStats" class="tag-stats"></div><p id="tagAdvice" class="advice"></p></section></div>
        </div>
        <div id="studyNotePane" class="hidden"><input id="studyNoteSearch" class="search-input" placeholder="搜索笔记标题或内容"><div class="review-filters"><select id="studyNoteSubjectFilter"><option value="">全部科目</option></select><div class="note-storage-hint">图片仅保存在当前浏览器</div></div><div id="studyNoteList" class="study-note-list"></div></div>
        <div id="mockPane" class="hidden"><div id="mockSeriesFilters" class="filter-row"></div><div id="mockContent"></div></div>
      </section>
      <section class="page" data-page="journal">
        <div class="page-title"><div><span>JOURNAL</span><h1>日记</h1></div><button class="primary small" data-action="add-note">＋ 随手记</button></div>
        <div class="tabs three-tabs" id="journalTabs"><button class="active" data-journal-view="today">今日</button><button data-journal-view="history">历史</button><button data-journal-view="settings">设置</button></div>
        <div id="journalToday"><div class="date-switch"><button data-journal-shift="-1">‹</button><button class="date-label" id="journalDateLabel"></button><button data-journal-shift="1">›</button><button class="today-btn" data-action="journal-today">今天</button></div><div id="journalTodayContent"></div></div>
        <div id="journalHistory" class="hidden"><div id="journalHistoryList" class="journal-history"></div></div>
        <div id="journalSettings" class="hidden"><section class="card"><div class="section-title"><h2>生活打卡项目</h2><button class="text-btn" data-action="add-event-type">＋ 新增</button></div><div id="eventTypeList" class="settings-list"></div></section><section class="card"><div class="section-title"><h2>今天问问自己</h2><button class="text-btn" data-action="add-question">＋ 新增</button></div><div id="questionList" class="settings-list"></div></section></div>
      </section>
      <section class="page" data-page="stats">
        <div class="page-title"><div><span>INSIGHTS</span><h1>统计</h1></div></div>
        <div class="tabs" id="statsTabs"><button class="active" data-stats-mode="day">日</button><button data-stats-mode="week">周</button><button data-stats-mode="month">月</button></div>
        <div class="date-switch stats-switch"><button data-stats-shift="-1">‹</button><button class="date-label" id="statsDateLabel"></button><button data-stats-shift="1">›</button><button class="today-btn" data-action="stats-today">当前</button></div><div id="statsContent"></div>
      </section>
    </main>
    <section id="miniTimer" class="mini-timer hidden"><button class="mini-timer-main" data-action="timer-focus"><i></i><span><b id="timerTask">学习计时</b><small id="timerSubject"></small></span><strong id="timerClock">00:00:00</strong></button><button class="mini-timer-toggle" id="timerToggle">暂停</button><button class="mini-timer-finish" data-action="timer-finish">结束</button></section>
    <nav class="bottom-nav"><button class="active" data-nav="home"><span>⌂</span><small>主页</small></button><button data-nav="tasks"><span>✓</span><small>进度</small></button><button data-nav="reviews"><span>◇</span><small>复盘</small></button><button data-nav="journal"><span>✎</span><small>日记</small></button><button data-nav="stats"><span>▤</span><small>统计</small></button></nav>
  </div>
  <dialog id="formDialog" class="sheet"><form id="entityForm" novalidate><div class="sheet-head"><div><small id="formKicker"></small><h2 id="formTitle"></h2></div><button type="button" class="icon-btn" data-close>×</button></div><div id="formFields" class="form-fields"></div><p id="formError" class="form-error"></p><button class="primary full" type="submit" id="formSubmit">保存</button></form></dialog>
  <dialog id="detailDialog" class="sheet"><div id="detailContent"></div></dialog>
  <dialog id="confirmDialog" class="confirm-dialog"><form method="dialog"><div class="warn">!</div><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="confirm-actions"><button value="cancel" class="secondary">取消</button><button value="ok" class="danger" id="confirmOk">确认</button></div></form></dialog>
  <input type="file" id="backupInput" accept="application/json" hidden><div id="toasts" class="toasts" aria-live="polite"></div><script src="app.js?v=20261101-1"></script>
</body>
</html>
