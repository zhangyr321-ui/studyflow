name: StudyFlow checks

on:
  push:
    branches:
      - feature/auth-cloud-sync
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check supabase-config.js
      - name: Check database schema exists
        run: test -s supabase/schema.sql
